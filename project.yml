# XcodeGen 项目描述：CI 在 macOS 上用它生成 App.xcodeproj（Windows 上无法生成 .xcodeproj）。
# 目标名 App-iOS 和 scheme 名被 CI 引用，不要改。
# App/Shared 是 App 和分享扩展共用的代码；Tests/ 放单元测试，UITests/ 放界面测试。
name: App
options:
  bundleIdPrefix: com.adamdashen666
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    APP_NAME: LanDrop
    DISPLAY_NAME: 局域网互传
    BUNDLE_ID_BASE: com.adamdashen666.landrop
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: $(DISPLAY_NAME)
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 用于发现局域网里的电脑并与它互传文件和文本
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # 签名在 CI 里单独处理：先出未签名包再按需重签
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  App-iOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Shared
      - App/Resources
    dependencies:
      - target: ShareExt
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        # 只放生成不了的键（数组/字典），其余由 GENERATE_INFOPLIST_FILE 合并进去
        INFOPLIST_FILE: App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_IDENTITY: ""

  ShareExt:
    type: app-extension
    platform: iOS
    sources:
      - App/Shared
      - ShareExt
    settings:
      base:
        PRODUCT_NAME: ShareExt
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).share
        INFOPLIST_FILE: App/ShareExt-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_IDENTITY: ""

  AppTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: App-iOS
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)Tests
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_NAME).app/$(APP_NAME)
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: ""

  AppUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: App-iOS
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)UITests
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).uitests
        TEST_TARGET_NAME: App-iOS
        CODE_SIGN_IDENTITY: ""

schemes:
  App-iOS:
    build:
      targets:
        App-iOS: all
    test:
      targets: [AppTests-iOS, AppUITests-iOS]
